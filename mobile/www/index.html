<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <title>Katalis</title>
    <style>
      :root {
        --primary: #5794f6;
        --secondary: #f3b835;
        --surface: #fcf9ef;
        --ink: #2f2e2e;
        --muted: #535252;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: var(--surface);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 320px;
        padding: 24px;
      }
      .wordmark {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--primary);
      }
      .wordmark span {
        color: var(--secondary);
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid color-mix(in srgb, var(--primary) 20%, transparent);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.5;
      }
      .retry {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        cursor: pointer;
      }
      .retry:active {
        transform: scale(0.97);
      }
      .offline .spinner {
        display: none;
      }
      .offline .loading-text {
        display: none;
      }
      .offline .offline-block {
        display: block;
      }
      .offline-block {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="wordmark">Katal<span>is</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status loading-text">Memuat Katalis…</p>
      <div class="offline-block">
        <p class="status">Tidak ada koneksi internet. Sambungkan ke jaringan lalu coba lagi.</p>
        <button class="retry" type="button" onclick="location.reload()">Coba Lagi</button>
      </div>
    </div>
    <script>
      // In server-mode the WebView normally navigates straight to the remote
      // app, so this shell is only seen while loading or when the device is
      // offline. Reflect connectivity for the offline case.
      function syncOnline() {
        document.body.classList.toggle("offline", !navigator.onLine);
      }
      window.addEventListener("online", syncOnline);
      window.addEventListener("offline", syncOnline);
      syncOnline();
    </script>
  </body>
</html>
